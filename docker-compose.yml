services:
  mysql:
    image: mysql:8.0.33
    container_name: training-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345678}
      MYSQL_DATABASE: training
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/main/resources/data-seed.sql:/docker-entrypoint-initdb.d/02-data.sql
    networks:
      - training-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.2-alpine
    container_name: training-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - training-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: training-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/training?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-12345678}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-eduforge-training-platform-secret-key-2024-please-override-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - training-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:1.25-alpine
    container_name: training-frontend
    ports:
      - "80:80"
    volumes:
      - ./training-frontend/dist:/usr/share/nginx/html
      - ./training-frontend/nginx-docker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - training-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  training-network:
    driver: bridge